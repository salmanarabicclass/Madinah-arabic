<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Madinah Arabic Vocabulary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;700&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #EDF0F4;
    --surface: #FFFFFF;
    --ink: #17202E;
    --muted: #5B6676;
    --line: #D3D9E2;
    --seg: #DDE2EA;
    --accent: #0E6A62;
    --accent-ink: #FFFFFF;
    --accent-soft: #DCEFEC;
    --good: #1B7F4B;
    --good-soft: #DDF1E5;
    --bad: #B3382C;
    --bad-soft: #F9E1DE;
    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #10151C;
      --surface: #19212B;
      --ink: #E8EDF3;
      --muted: #98A3B3;
      --line: #2B3644;
      --seg: #232D3A;
      --accent: #4DBFB2;
      --accent-ink: #08221F;
      --accent-soft: #17332F;
      --good: #5BC98B;
      --good-soft: #17301F;
      --bad: #F08B7E;
      --bad-soft: #3A1E1B;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #10151C;
    --surface: #19212B;
    --ink: #E8EDF3;
    --muted: #98A3B3;
    --line: #2B3644;
    --seg: #232D3A;
    --accent: #4DBFB2;
    --accent-ink: #08221F;
    --accent-soft: #17332F;
    --good: #5BC98B;
    --good-soft: #17301F;
    --bad: #F08B7E;
    --bad-soft: #3A1E1B;
    color-scheme: dark;
  }
  html { background: var(--bg); scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: inherit; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.45;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 18px 16px 40px; }
  h1 { font-size: 22px; line-height: 1.2; margin: 0; font-weight: 700; }
  .sub { color: var(--muted); margin: 2px 0 16px; font-size: 15px; }
  .ar { font-family: "Noto Naskh Arabic", "Geeza Pro", "Traditional Arabic", serif; direction: rtl; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible, .card:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .settings { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 12px; }
  .settings > summary { list-style: none; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 16px; min-height: 48px; cursor: pointer; font-weight: 700; }
  .settings > summary::-webkit-details-marker { display: none; }
  .settings > summary::after { content: "Change"; font-weight: 600; font-size: 14px; color: var(--accent); flex: 0 0 auto; }
  .settings[open] > summary::after { content: "Done"; }
  .settings-sum { font-weight: 400; color: var(--muted); font-size: 14px; display: block; }
  .settings-body { padding: 0 16px 6px; }
  .filter-group { margin-bottom: 12px; }
  .filter-label { font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin: 0 0 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    border: 1.5px solid var(--line); background: var(--surface); color: var(--ink);
    padding: 8px 14px; border-radius: 999px; font-weight: 600; min-height: 40px;
  }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

  .seg { display: flex; gap: 3px; background: var(--seg); border-radius: 12px; padding: 3px; margin-bottom: 10px; }
  .seg button { flex: 1; border: 0; background: transparent; color: var(--muted); font-weight: 600; padding: 10px 8px; border-radius: 9px; min-height: 44px; }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.14); }

  .toggles { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 4px 0 14px; font-size: 15px; }
  .tog { display: inline-flex; align-items: center; gap: 8px; min-height: 36px; }
  .tog input { width: 20px; height: 20px; accent-color: var(--accent); }
  .tog.off { color: var(--muted); }

  .tabs { display: flex; gap: 0; border-bottom: 2px solid var(--line); margin: 18px 0 16px; }
  .tabs button { flex: 1; background: none; border: 0; padding: 12px 8px; font-weight: 700; font-size: 17px; color: var(--muted); border-bottom: 4px solid transparent; margin-bottom: -2px; }
  .tabs button[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }

  .counter { display: flex; justify-content: space-between; color: var(--muted); font-size: 15px; margin-bottom: 8px; }

  .card-wrap { perspective: 1200px; }
  .card { position: relative; min-height: 310px; transform-style: preserve-3d; transition: transform .45s ease; cursor: pointer; border-radius: 20px; }
  .card.flipped { transform: rotateY(180deg); }
  .face {
    position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    padding: 20px; text-align: center;
    background: var(--surface); border: 1px solid var(--line); border-radius: 20px; box-shadow: 0 4px 0 var(--line);
  }
  .face.back { transform: rotateY(180deg); background: var(--accent-soft); border-color: var(--accent); box-shadow: 0 4px 0 var(--accent); }
  .big.ar { font-size: clamp(54px, 17vw, 80px); line-height: 1.6; }
  .small.ar { font-size: 30px; line-height: 1.6; color: var(--muted); }
  .en { font-size: 22px; font-weight: 700; }
  .en.big { font-size: 32px; line-height: 1.2; }
  .tr { color: var(--muted); font-size: 20px; font-style: italic; }
  .hint { position: absolute; bottom: 14px; font-size: 14px; color: var(--muted); }
  .sample { font-size: 16px; line-height: 1.5; color: var(--muted); max-width: 32ch; margin-top: 6px; }
  .sample.ar { font-size: 22px; line-height: 1.8; max-width: none; }
  .sample strong { color: var(--ink); font-weight: 700; }
  .sub a { color: var(--accent); font-weight: 600; }
  .type { position: absolute; top: 10px; right: 16px; font-size: 18px; line-height: 1.6; color: var(--muted); }

  .actions { display: flex; gap: 10px; margin-top: 18px; }
  .btn { border: 0; border-radius: 12px; padding: 14px 16px; font-weight: 700; min-height: 50px; flex: 1; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); }
  .btn.secondary { background: var(--surface); border: 1.5px solid var(--line); }
  .btn[disabled] { opacity: .45; cursor: default; }
  .btn.small-btn { flex: 0 0 auto; padding: 14px 18px; }

  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 20px; }
  .panel h2 { font-size: 20px; margin: 0 0 8px; }
  .panel p { margin: 0 0 12px; }
  .muted { color: var(--muted); }

  .prompt { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; box-shadow: 0 4px 0 var(--line); min-height: 170px; padding: 18px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-align: center; margin-bottom: 14px; }
  .opts { display: grid; gap: 10px; }
  .opt {
    display: flex; align-items: center; justify-content: space-between; gap: 10px; text-align: left;
    background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; padding: 12px 16px; min-height: 56px; font-size: 18px; font-weight: 600;
  }
  .opt.ar { justify-content: space-between; font-size: 32px; font-weight: 400; direction: ltr; }
  .opt .label.ar { direction: rtl; line-height: 1.5; }
  .opt .mark { font-size: 14px; font-weight: 700; }
  .opt.correct { border-color: var(--good); background: var(--good-soft); }
  .opt.correct .mark { color: var(--good); }
  .opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
  .opt.wrong .mark { color: var(--bad); }
  .opt[disabled] { cursor: default; }
  .feedback { margin-top: 14px; padding: 14px 16px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); }
  .feedback strong { display: block; margin-bottom: 4px; }
  .feedback .ar { font-size: 28px; line-height: 1.5; }

  .score { font-size: 56px; font-weight: 700; line-height: 1.1; margin: 4px 0 4px; }
  .missed { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 8px; }
  .missed li { display: flex; align-items: center; justify-content: space-between; gap: 12px; border-top: 1px solid var(--line); padding-top: 8px; }
  .missed .ar { font-size: 28px; line-height: 1.5; }
  .missed .meaning { text-align: right; }
  .missed .meaning span { display: block; color: var(--muted); font-style: italic; font-size: 15px; }

  .foot { margin-top: 26px; color: var(--muted); font-size: 14px; }

  @media (prefers-reduced-motion: reduce) { .card { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>Madinah Arabic Vocabulary</h1>
  <p class="sub">Book One class vocabulary · <a id="bankLink" href="#" target="_blank" rel="noopener">Word bank ↗</a></p>

  <details class="settings" id="settings">
    <summary><span>Lessons &amp; options<span class="settings-sum" id="settingsSum"></span></span></summary>
    <div class="settings-body">
      <div id="filters"></div>
      <div class="toggles" id="globalToggles"></div>
    </div>
  </details>
  <div class="seg" id="dir" role="group" aria-label="Direction"></div>

  <div class="tabs" id="tabs"></div>
  <main id="main"></main>

  <p class="foot">Your practice list is saved in this browser only.</p>
</div>

<script>
(function () {
  // Vocabulary lives in the "RC Arabic Vocab" Google Sheet.
  // Columns: Arabic, English, Book, Lesson, Category (optional: Transliteration).
  // The sheet must be shared as "Anyone with the link: Viewer".
  var SHEET_ID = "1-TLcwF_g2QhAATTMvclwWWCSz5mAdXLTTwo5XNJFRtk";
  var SHEET_NAME = "Sheet1";
  // Loaded as a script (JSONP) because the CSV endpoint can't be read across sites.
  var SHEET_URL = "https://docs.google.com/spreadsheets/d/" + SHEET_ID +
    "/gviz/tq?headers=1&sheet=" + encodeURIComponent(SHEET_NAME) + "&tqx=responseHandler:";

  // Filter groups, built from the sheet's Book, Lesson and Category values.
  var GROUPS = [
    { key: "book", label: "Book", plural: "books", chip: function (v) { return /^\d+$/.test(v) ? "Book " + v : v; } },
    { key: "lesson", label: "Lesson", plural: "lessons", chip: function (v) { return /^\d+$/.test(v) ? "Lesson " + v : v; } },
    { key: "category", label: "Category", plural: "categories", chip: function (v) { return v; } }
  ];

  var WORDS = [];
  var VALUES = {};
  var HAS_TR = false;

  // Resolves to rows of strings, header row first.
  function loadSheet() {
    return new Promise(function (resolve, reject) {
      var cb = "__vocabSheet" + Date.now();
      var tag = document.createElement("script");
      var timer = setTimeout(function () { done(new Error("Timed out")); }, 15000);
      function done(err, rows) {
        clearTimeout(timer);
        delete window[cb];
        tag.remove();
        if (err) reject(err); else resolve(rows);
      }
      window[cb] = function (res) {
        if (!res || res.status === "error" || !res.table) {
          var e = res && res.errors && res.errors[0];
          return done(new Error(e ? e.detailed_message || e.message : "Bad response"));
        }
        function cell(c) {
          if (!c || c.v === null || c.v === undefined) return "";
          return typeof c.v === "string" ? c.v : (c.f !== undefined ? c.f : String(c.v));
        }
        var rows = [res.table.cols.map(function (c) { return c.label || ""; })];
        res.table.rows.forEach(function (r) { rows.push((r.c || []).map(cell)); });
        done(null, rows);
      };
      tag.onerror = function () { done(new Error("Network error, or the sheet is not shared publicly")); };
      tag.src = SHEET_URL + cb + "&_=" + Date.now();
      document.head.appendChild(tag);
    });
  }

  function sortValues(a, b) {
    var na = parseFloat(a), nb = parseFloat(b);
    if (!isNaN(na) && !isNaN(nb) && na !== nb) return na - nb;
    return a.localeCompare(b);
  }

  function setWords(rows) {
    // Google sometimes leaves the column labels blank and sends the header
    // row as the first data row, so look for the names in either place.
    function names(r) { return (r || []).map(function (h) { return String(h).trim().toLowerCase(); }); }
    var head = names(rows.shift());
    if (head.indexOf("arabic") < 0 && names(rows[0]).indexOf("arabic") >= 0) head = names(rows.shift());
    // No names found: use the column order Arabic, English, Book, Lesson, Category, Transliteration.
    if (head.indexOf("arabic") < 0) head = ["arabic", "english", "book", "lesson", "category", "type", "sample sentence arabic", "sample sentence translation", "transliteration"];
    function col(name) { return head.indexOf(name); }
    var ci = { ar: col("arabic"), en: col("english"), book: col("book"), lesson: col("lesson"), category: col("category"), type: col("type"), sar: col("sample sentence arabic"), sen: col("sample sentence translation"), tr: col("transliteration") };
    if (ci.en < 0) throw new Error("The sheet needs Arabic and English columns.");
    function get(r, i) { return i < 0 ? "" : String(r[i] || "").trim(); }
    WORDS = rows.map(function (r) {
      return { ar: get(r, ci.ar), en: get(r, ci.en), book: get(r, ci.book), lesson: get(r, ci.lesson), category: get(r, ci.category), type: get(r, ci.type), sar: get(r, ci.sar), sen: get(r, ci.sen), tr: get(r, ci.tr) };
    }).filter(function (w) { return w.ar && w.en; });
    HAS_TR = WORDS.some(function (w) { return w.tr; });
    GROUPS.forEach(function (g) {
      var seen = {};
      WORDS.forEach(function (w) { if (w[g.key]) seen[w[g.key]] = true; });
      VALUES[g.key] = Object.keys(seen).sort(sortValues);
      S.filters[g.key] = new Set(VALUES[g.key]);
    });
  }

  var KEY = "madinah-vocab-practice-v1";
  function load() { try { return JSON.parse(localStorage.getItem(KEY) || "[]"); } catch (e) { return []; } }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(Array.from(S.missed))); } catch (e) {} }

  var S = {
    tab: "cards",
    dir: "ar-en",
    pron: false,
    filters: {},
    shuffle: true,
    onlyReview: false,
    deck: null,
    i: 0,
    flipped: false,
    results: {},
    quizN: 10,
    quiz: { phase: "setup" },
    missed: new Set(load())
  };

  function $(s) { return document.querySelector(s); }
  function shuffled(a) {
    var b = a.slice();
    for (var i = b.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = b[i]; b[i] = b[j]; b[j] = t;
    }
    return b;
  }
  // A word is included when, in every group that has values, its value is selected.
  function matches(w) {
    return GROUPS.every(function (g) {
      return !VALUES[g.key].length || !w[g.key] || S.filters[g.key].has(w[g.key]);
    });
  }
  function pool() { return WORDS.filter(matches); }
  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  // Bold the vocabulary word in a sample sentence. Text wrapped in *asterisks*
  // is bolded; without asterisks, the word itself is found (ignoring Arabic
  // vowel marks, capitals and notes in brackets like "(masculine)").
  var MARKS = /[\u064B-\u065F\u0670]/;
  function highlight(text, word) {
    if (/\*[^*]+\*/.test(text)) {
      return text.split(/\*([^*]+)\*/).map(function (part, i) {
        return i % 2 ? "<strong>" + esc(part) + "</strong>" : esc(part);
      }).join("");
    }
    function fold(str) {
      var out = "", map = [];
      for (var i = 0; i < str.length; i++) {
        if (MARKS.test(str[i])) continue;
        out += str[i].toLowerCase(); map.push(i);
      }
      return { s: out, map: map };
    }
    var target = fold(word.replace(/\s*\(.*?\)\s*/g, " ").replace(/[?؟…]/g, "").trim()).s;
    var t = fold(text), at = target ? t.s.indexOf(target) : -1;
    // English words must match whole words, so "in" isn't found inside "this".
    var letter = /[a-z]/;
    while (at >= 0 && letter.test(target) && (letter.test(t.s[at - 1] || "") || letter.test(t.s[at + target.length] || ""))) {
      at = t.s.indexOf(target, at + 1);
    }
    if (at < 0) return esc(text);
    var start = t.map[at], end = t.map[at + target.length - 1] + 1;
    while (end < text.length && MARKS.test(text[end])) end++;
    return esc(text.slice(0, start)) + "<strong>" + esc(text.slice(start, end)) + "</strong>" + esc(text.slice(end));
  }
  function sampleAr(w) { return w.sar ? '<div class="sample ar" lang="ar">' + highlight(w.sar, w.ar) + "</div>" : ""; }
  function sampleEn(w) { return w.sen ? '<div class="sample">' + highlight(w.sen, w.en) + "</div>" : ""; }
  function trLine(w) { return w.tr ? '<div class="tr">' + esc(w.tr) + "</div>" : ""; }

  function buildDeck(list) {
    var p = list || pool();
    if (!list && S.onlyReview) p = p.filter(function (w) { return S.missed.has(w.ar); });
    S.deck = S.shuffle ? shuffled(p) : p.slice();
    S.i = 0;
    S.flipped = false;
    S.results = {};
  }

  /* ---------- shared controls ---------- */
  function renderChips() {
    var h = "";
    GROUPS.forEach(function (g) {
      var vals = VALUES[g.key];
      if (vals.length < 2) return;
      h += '<div class="filter-group"><p class="filter-label">' + g.label + '</p><div class="chips" role="group" aria-label="Choose ' + g.label.toLowerCase() + '">';
      vals.forEach(function (v) {
        var n = WORDS.filter(function (w) { return w[g.key] === v; }).length;
        h += '<button class="chip" data-group="' + g.key + '" data-val="' + esc(v) + '" aria-pressed="' + S.filters[g.key].has(v) + '">' + esc(g.chip(v)) + " (" + n + ")</button>";
      });
      h += "</div></div>";
    });
    $("#filters").innerHTML = h;
    Array.prototype.forEach.call(document.querySelectorAll(".chip"), function (b) {
      b.addEventListener("click", function () {
        var set = S.filters[b.getAttribute("data-group")];
        var v = b.getAttribute("data-val");
        if (set.has(v)) { if (set.size > 1) set.delete(v); }
        else set.add(v);
        S.deck = null;
        S.quiz = { phase: "setup" };
        render();
      });
    });
  }

  function renderDir() {
    $("#dir").innerHTML =
      '<button data-dir="ar-en" aria-pressed="' + (S.dir === "ar-en") + '">Arabic to English</button>' +
      '<button data-dir="en-ar" aria-pressed="' + (S.dir === "en-ar") + '">English to Arabic</button>';
    Array.prototype.forEach.call(document.querySelectorAll("#dir button"), function (b) {
      b.addEventListener("click", function () {
        S.dir = b.getAttribute("data-dir");
        S.flipped = false;
        if (S.quiz.phase !== "setup") S.quiz = { phase: "setup" };
        render();
      });
    });
    if (!HAS_TR) { $("#globalToggles").innerHTML = ""; return; }
    $("#globalToggles").innerHTML =
      '<label class="tog"><input type="checkbox" id="t-pron"' + (S.pron ? " checked" : "") + '> Show pronunciation with Arabic</label>';
    $("#t-pron").addEventListener("change", function (e) { S.pron = e.target.checked; render(); });
  }

  function renderTabs() {
    $("#tabs").innerHTML =
      '<button data-tab="cards"' + (S.tab === "cards" ? ' aria-current="page"' : "") + ">Flashcards</button>" +
      '<button data-tab="quiz"' + (S.tab === "quiz" ? ' aria-current="page"' : "") + ">Quiz</button>";
    Array.prototype.forEach.call(document.querySelectorAll("#tabs button"), function (b) {
      b.addEventListener("click", function () { S.tab = b.getAttribute("data-tab"); render(); });
    });
  }

  /* ---------- flashcards ---------- */
  function cardFaces(w) {
    var front, back;
    if (S.dir === "ar-en") {
      front = '<div class="big ar" lang="ar">' + esc(w.ar) + "</div>" + (S.pron ? trLine(w) : "") + sampleAr(w);
      back = '<div class="en">' + esc(w.en) + "</div>" + trLine(w) + '<div class="small ar" lang="ar">' + esc(w.ar) + "</div>" + sampleEn(w);
    } else {
      front = '<div class="en big">' + esc(w.en) + "</div>" + sampleEn(w);
      back = '<div class="big ar" lang="ar">' + esc(w.ar) + "</div>" + trLine(w) + sampleAr(w);
    }
    var type = w.type ? '<span class="type ar" lang="ar">' + esc(w.type) + "</span>" : "";
    return { front: type + front, back: type + back };
  }

  function renderCards() {
    if (!S.deck) buildDeck();
    var p = pool();
    var reviewCount = p.filter(function (w) { return S.missed.has(w.ar); }).length;
    var h = '<div class="toggles">' +
      '<label class="tog"><input type="checkbox" id="t-shuffle"' + (S.shuffle ? " checked" : "") + "> Shuffle</label>" +
      '<label class="tog' + (reviewCount ? "" : " off") + '"><input type="checkbox" id="t-review"' + (S.onlyReview ? " checked" : "") + (reviewCount ? "" : " disabled") + "> Only words to practice (" + reviewCount + ")</label>" +
      "</div>";

    if (!S.deck.length) {
      h += '<div class="panel"><h2>No words here yet</h2><p class="muted">Turn off “Only words to practice” or choose another lesson.</p></div>';
      $("#main").innerHTML = h;
      bindDeckToggles();
      return;
    }

    if (S.i >= S.deck.length) {
      var got = 0, again = [];
      S.deck.forEach(function (w) {
        if (S.results[w.ar] === "got") got++;
        else if (S.results[w.ar] === "again") again.push(w);
      });
      h += '<div class="panel"><h2>Deck finished</h2>' +
        "<p>You marked <strong>" + got + "</strong> of " + S.deck.length + " as known" +
        (again.length ? " and " + again.length + " for more practice." : ".") + "</p>" +
        '<div class="actions">' +
        '<button class="btn secondary" id="restart">Restart deck</button>' +
        (again.length ? '<button class="btn primary" id="practice">Practice those ' + again.length + "</button>" : "") +
        "</div></div>";
      $("#main").innerHTML = h;
      bindDeckToggles();
      $("#restart").addEventListener("click", function () { buildDeck(); renderCards(); });
      if (again.length) $("#practice").addEventListener("click", function () { buildDeck(again); renderCards(); });
      return;
    }

    var w = S.deck[S.i];
    var f = cardFaces(w);
    h += '<div class="counter"><span>Card ' + (S.i + 1) + " of " + S.deck.length + "</span></div>" +
      '<div class="card-wrap"><div class="card' + (S.flipped ? " flipped" : "") + '" id="card" role="button" tabindex="0" aria-label="Flashcard. Press to flip.">' +
      '<div class="face front" aria-hidden="' + S.flipped + '">' + f.front + '<div class="hint">Tap to flip</div></div>' +
      '<div class="face back" aria-hidden="' + !S.flipped + '">' + f.back + "</div>" +
      "</div></div>" +
      '<div class="actions">' +
      '<button class="btn secondary small-btn" id="prev"' + (S.i === 0 ? " disabled" : "") + ">Back</button>" +
      '<button class="btn secondary" id="again">Need practice</button>' +
      '<button class="btn primary" id="got">Got it</button>' +
      "</div>";
    $("#main").innerHTML = h;
    bindDeckToggles();

    var card = $("#card");
    function flip() {
      S.flipped = !S.flipped;
      card.classList.toggle("flipped", S.flipped);
      card.querySelector(".front").setAttribute("aria-hidden", String(S.flipped));
      card.querySelector(".back").setAttribute("aria-hidden", String(!S.flipped));
    }
    card.addEventListener("click", flip);
    card.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); flip(); }
    });
    function advance(result) {
      S.results[w.ar] = result;
      if (result === "got") S.missed.delete(w.ar); else S.missed.add(w.ar);
      save();
      S.i++;
      S.flipped = false;
      renderCards();
      keepInView();
    }
    $("#got").addEventListener("click", function () { advance("got"); });
    $("#again").addEventListener("click", function () { advance("again"); });
    $("#prev").addEventListener("click", function () { if (S.i > 0) { S.i--; S.flipped = false; renderCards(); keepInView(); } });
  }

  function bindDeckToggles() {
    var a = $("#t-shuffle"), b = $("#t-review");
    if (a) a.addEventListener("change", function (e) { S.shuffle = e.target.checked; buildDeck(); renderCards(); });
    if (b) b.addEventListener("change", function (e) { S.onlyReview = e.target.checked; buildDeck(); renderCards(); });
  }

  /* ---------- quiz ---------- */
  function label(x) { return S.dir === "ar-en" ? x.en : x.ar; }

  function makeOptions(w) {
    var others = shuffled(pool().filter(function (x) { return x.ar !== w.ar && x.en !== w.en; }));
    if (others.length < 3) {
      var extra = shuffled(WORDS.filter(function (x) {
        return x.ar !== w.ar && x.en !== w.en && others.indexOf(x) === -1;
      }));
      others = others.concat(extra);
    }
    return shuffled([w].concat(others.slice(0, 3)));
  }

  function startQuiz(list) {
    var qs = list.map(function (w) { return { w: w, opts: makeOptions(w) }; });
    S.quiz = { phase: "ask", qs: qs, n: 0, score: 0, picked: null, missedList: [] };
  }

  function renderQuiz() {
    var q = S.quiz;
    var m = $("#main");

    if (q.phase === "setup") {
      var size = pool().length;
      var h = '<div class="panel"><h2>Quiz</h2>' +
        '<p class="muted">Pick the right answer for each word. You can retake it as often as you like.</p>' +
        '<div class="seg" id="qn" role="group" aria-label="Number of questions">';
      [10, 20, 0].forEach(function (n) {
        var text = n === 0 ? "All (" + size + ")" : String(n);
        h += '<button data-n="' + n + '" aria-pressed="' + (S.quizN === n) + '">' + text + "</button>";
      });
      h += '</div><button class="btn primary" id="start" style="width:100%"' + (size < 2 ? " disabled" : "") + ">Start quiz</button></div>";
      m.innerHTML = h;
      Array.prototype.forEach.call(document.querySelectorAll("#qn button"), function (b) {
        b.addEventListener("click", function () { S.quizN = parseInt(b.getAttribute("data-n"), 10); renderQuiz(); });
      });
      $("#start").addEventListener("click", function () {
        var list = shuffled(pool());
        if (S.quizN > 0) list = list.slice(0, S.quizN);
        startQuiz(list);
        renderQuiz();
      });
      return;
    }

    if (q.phase === "result") {
      var total = q.qs.length;
      var pct = Math.round((q.score / total) * 100);
      var msg = q.score === total ? "Perfect score." : pct >= 80 ? "Strong work. Review the few you missed." : pct >= 50 ? "Good start. Practice the ones below and try again." : "Keep going. Flashcards will help before your next try.";
      var r = '<div class="panel"><h2>Your score</h2><div class="score">' + q.score + " of " + total + '</div><p class="muted">' + msg + "</p>";
      if (q.missedList.length) {
        r += "<p><strong>Words to review</strong></p><ul class=\"missed\">";
        q.missedList.forEach(function (w) {
          r += '<li><span class="ar" lang="ar">' + esc(w.ar) + '</span><span class="meaning">' + esc(w.en) + (w.tr ? "<span>" + esc(w.tr) + "</span>" : "") + "</span></li>";
        });
        r += "</ul>";
      }
      r += '<div class="actions" style="margin-top:18px">' +
        '<button class="btn secondary" id="newq">New quiz</button>' +
        (q.missedList.length ? '<button class="btn primary" id="retry">Retry missed</button>' : "") +
        "</div></div>";
      m.innerHTML = r;
      $("#newq").addEventListener("click", function () { S.quiz = { phase: "setup" }; renderQuiz(); });
      if (q.missedList.length) $("#retry").addEventListener("click", function () { startQuiz(shuffled(q.missedList)); renderQuiz(); });
      return;
    }

    // ask phase
    var cur = q.qs[q.n];
    var w = cur.w;
    var prompt;
    if (S.dir === "ar-en") {
      prompt = '<div class="big ar" lang="ar">' + esc(w.ar) + "</div>" + (S.pron ? trLine(w) : "");
    } else {
      prompt = '<div class="en big">' + esc(w.en) + "</div>";
    }
    var isAr = S.dir === "en-ar";
    var html = '<div class="counter"><span>Question ' + (q.n + 1) + " of " + q.qs.length + "</span><span>Score " + q.score + "</span></div>" +
      '<div class="prompt">' + prompt + "</div><div class=\"opts\">";
    cur.opts.forEach(function (o, idx) {
      var cls = "opt" + (isAr ? " ar" : "");
      var mark = "";
      if (q.picked !== null) {
        if (o.ar === w.ar) { cls += " correct"; mark = '<span class="mark">✓ Correct</span>'; }
        else if (idx === q.picked) { cls += " wrong"; mark = '<span class="mark">✗ Not this one</span>'; }
      }
      html += '<button class="' + cls + '" data-i="' + idx + '"' + (q.picked !== null ? " disabled" : "") + ">" +
        '<span class="label' + (isAr ? " ar" : "") + '"' + (isAr ? ' lang="ar"' : "") + ">" + esc(isAr ? o.ar : o.en) + "</span>" + mark + "</button>";
    });
    html += "</div>";
    if (q.picked !== null) {
      var ok = cur.opts[q.picked].ar === w.ar;
      html += '<div class="feedback"><strong>' + (ok ? "Correct." : "Not quite.") + '</strong><span class="ar" lang="ar">' + esc(w.ar) + "</span> " +
        (w.tr ? '<span class="tr">' + esc(w.tr) + "</span> " : "") + "means <strong style=\"display:inline\">" + esc(w.en) + "</strong>.</div>" +
        '<div class="actions"><button class="btn primary" id="next">' + (q.n + 1 === q.qs.length ? "See my score" : "Next question") + "</button></div>";
    }
    m.innerHTML = html;

    Array.prototype.forEach.call(document.querySelectorAll(".opt"), function (b) {
      b.addEventListener("click", function () {
        if (q.picked !== null) return;
        var idx = parseInt(b.getAttribute("data-i"), 10);
        q.picked = idx;
        if (cur.opts[idx].ar === w.ar) { q.score++; }
        else { q.missedList.push(w); S.missed.add(w.ar); save(); }
        renderQuiz();
        var n = $("#next");
        if (n) {
          var r = n.getBoundingClientRect();
          if (r.bottom > window.innerHeight) window.scrollBy({ top: r.bottom - window.innerHeight + 16, behavior: smooth() });
        }
      });
    });
    var nx = $("#next");
    if (nx) nx.addEventListener("click", function () {
      q.n++;
      q.picked = null;
      if (q.n >= q.qs.length) q.phase = "result";
      renderQuiz();
      keepInView();
    });
  }

  function smooth() {
    return window.matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth";
  }
  // After moving to the next card or question, bring the practice area's top
  // into view if it has scrolled off screen, without jumping to the page top.
  function keepInView() {
    var top = $("#tabs").getBoundingClientRect().top;
    if (top < 0 || top > window.innerHeight * 0.5) window.scrollBy({ top: top - 8, behavior: smooth() });
  }

  function renderSummary() {
    var parts = [];
    GROUPS.forEach(function (g) {
      var vals = VALUES[g.key], sel = S.filters[g.key];
      if (vals.length < 2) return;
      if (sel.size === vals.length) parts.push("All " + g.plural);
      else if (sel.size <= 2) parts.push(vals.filter(function (v) { return sel.has(v); }).map(g.chip).join(", "));
      else parts.push(sel.size + " " + g.plural);
    });
    $("#settingsSum").textContent = parts.join(" · ") + " (" + pool().length + " words)";
  }

  function render() {
    renderChips();
    renderSummary();
    renderDir();
    renderTabs();
    if (S.tab === "cards") renderCards(); else renderQuiz();
  }

  function showMessage(title, body) {
    $("#main").innerHTML = '<div class="panel"><h2>' + title + '</h2><p class="muted">' + body + "</p></div>";
  }

  $("#bankLink").href = "https://docs.google.com/spreadsheets/d/" + SHEET_ID + "/edit?usp=sharing";
  showMessage("Loading words…", "Getting the latest vocabulary list.");
  loadSheet()
    .then(function (rows) {
      setWords(rows);
      if (!WORDS.length) { showMessage("No words yet", "The vocabulary sheet is empty."); return; }
      render();
    })
    .catch(function (err) {
      showMessage("Couldn't load the words", "Check your connection and reload the page. If this keeps happening, let your teacher know.<br><small>Details: " + esc(err && err.message || err) + "</small>");
    });
})();
</script>
